[tool:pytest]
# Pytest configuration for multi-retail POS testing framework

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --cov=models
    --cov=routes
    --cov=utils
    --cov=services
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    performance: Performance tests (measure speed and resource usage)
    security: Security tests (verify security measures)
    slow: Slow running tests (may take > 30 seconds)
    restaurant: Restaurant-specific tests
    apparel: Apparel-specific tests
    books: Books-specific tests
    grocery: Grocery-specific tests
    multi_tenant: Multi-tenancy tests
    feature_flags: Feature flag tests
    api: API endpoint tests
    ui: UI/UX tests
    database: Database tests
    offline: Offline mode tests
    synchronization: Data synchronization tests

# Minimum version
minversion = 6.0

# Test session configuration
timeout = 300
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution
# Uncomment to enable parallel testing (requires pytest-xdist)
# addopts = -n auto

# JUnit XML for CI/CD integration
# junit_family = xunit2
# junit_logging = all