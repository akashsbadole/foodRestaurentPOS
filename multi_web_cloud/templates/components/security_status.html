<!-- Security Status Indicator Component -->
<div x-data="securityStatus()" x-init="init()" class="security-status-component">
    <!-- Security Status Badge -->
    <div class="security-status-badge" 
         :class="securityLevel"
         @click="toggleSecurityDetails()"
         role="button"
         :aria-label="`Security Status: ${securityLevelText}`">
        <i class="bi" :class="securityIcon"></i>
        <span class="security-status-text" x-text="securityLevelText"></span>
        <i class="bi bi-chevron-down ms-1" :class="{'rotate-180': showDetails}"></i>
    </div>
    
    <!-- Security Details Panel -->
    <div x-show="showDetails" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         class="security-details-panel">
        
        <div class="security-details-header">
            <h6>Security Information</h6>
            <button @click="toggleSecurityDetails()" class="btn-close btn-close-sm"></button>
        </div>
        
        <div class="security-details-content">
            <!-- Session Information -->
            <div class="security-section">
                <div class="security-section-title">
                    <i class="bi bi-person-lock"></i>
                    Session Information
                </div>
                <div class="security-info-grid">
                    <div class="security-info-item">
                        <span class="security-info-label">User:</span>
                        <span class="security-info-value" x-text="sessionInfo.username"></span>
                    </div>
                    <div class="security-info-item">
                        <span class="security-info-label">Role:</span>
                        <span class="security-info-value" x-text="sessionInfo.role"></span>
                    </div>
                    <div class="security-info-item">
                        <span class="security-info-label">Session ID:</span>
                        <span class="security-info-value security-monospace" x-text="sessionInfo.sessionId"></span>
                    </div>
                    <div class="security-info-item">
                        <span class="security-info-label">Started:</span>
                        <span class="security-info-value" x-text="sessionInfo.startTime"></span>
                    </div>
                    <div class="security-info-item">
                        <span class="security-info-label">Expires:</span>
                        <span class="security-info-value" x-text="sessionInfo.expiresAt"></span>
                    </div>
                </div>
            </div>
            
            <!-- Security Events -->
            <div class="security-section">
                <div class="security-section-title">
                    <i class="bi bi-shield-check"></i>
                    Recent Security Events
                </div>
                <div class="security-events-list">
                    <template x-for="event in recentEvents" :key="event.id">
                        <div class="security-event-item" :class="event.type">
                            <div class="security-event-icon">
                                <i class="bi" :class="event.icon"></i>
                            </div>
                            <div class="security-event-content">
                                <div class="security-event-title" x-text="event.title"></div>
                                <div class="security-event-time" x-text="event.time"></div>
                            </div>
                        </div>
                    </template>
                    <div x-show="recentEvents.length === 0" class="no-events">
                        No recent security events
                    </div>
                </div>
            </div>
            
            <!-- Security Actions -->
            <div class="security-section">
                <div class="security-section-title">
                    <i class="bi bi-gear"></i>
                    Security Actions
                </div>
                <div class="security-actions">
                    <button @click="refreshSecurityStatus()" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Refresh Status
                    </button>
                    <button @click="viewSecurityLogs()" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-journal-text"></i> View Logs
                    </button>
                    <button @click="extendSession()" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-clock-history"></i> Extend Session
                    </button>
                    <button @click="secureLogout()" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-shield-x"></i> Secure Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Security Alert Modal -->
    <div x-show="showSecurityAlert" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="security-alert-overlay"
         @click.self="closeSecurityAlert()">
        
        <div class="security-alert-modal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform scale-95"
             x-transition:enter-end="opacity-100 transform scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform scale-100"
             x-transition:leave-end="opacity-0 transform scale-95">
            
            <div class="security-alert-header">
                <i class="bi" :class="securityAlertIcon"></i>
                <h5 x-text="securityAlertTitle"></h5>
            </div>
            
            <div class="security-alert-body">
                <p x-text="securityAlertMessage"></p>
            </div>
            
            <div class="security-alert-actions">
                <button @click="closeSecurityAlert()" class="btn btn-secondary">
                    Cancel
                </button>
                <button @click="confirmSecurityAction()" class="btn" :class="securityAlertButtonClass">
                    <i class="bi" :class="securityAlertButtonIcon"></i>
                    <span x-text="securityAlertButtonText"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function securityStatus() {
    return {
        showDetails: false,
        securityLevel: 'secure',
        securityLevelText: 'Secure',
        securityIcon: 'bi-shield-check',
        sessionInfo: {
            username: '',
            role: '',
            sessionId: '',
            startTime: '',
            expiresAt: ''
        },
        recentEvents: [],
        showSecurityAlert: false,
        securityAlertTitle: '',
        securityAlertMessage: '',
        securityAlertIcon: '',
        securityAlertButtonText: '',
        securityAlertButtonClass: '',
        securityAlertButtonIcon: '',
        securityAlertAction: null,
        
        init() {
            this.loadSecurityStatus();
            // Refresh security status every 30 seconds
            setInterval(() => {
                this.loadSecurityStatus();
            }, 30000);
        },
        
        async loadSecurityStatus() {
            try {
                const response = await fetch('/api/security/status');
                const data = await response.json();
                
                if (data.success) {
                    this.updateSecurityStatus(data);
                }
            } catch (error) {
                console.error('Error loading security status:', error);
                this.securityLevel = 'unknown';
                this.securityLevelText = 'Unknown';
                this.securityIcon = 'bi-question-circle';
            }
        },
        
        updateSecurityStatus(data) {
            this.securityLevel = data.security_level || 'secure';
            this.securityLevelText = data.security_level_text || 'Secure';
            this.securityIcon = data.security_icon || 'bi-shield-check';
            this.sessionInfo = data.session_info || {};
            this.recentEvents = data.recent_events || [];
        },
        
        toggleSecurityDetails() {
            this.showDetails = !this.showDetails;
        },
        
        async refreshSecurityStatus() {
            await this.loadSecurityStatus();
            this.showNotification('Security status refreshed', 'success');
        },
        
        viewSecurityLogs() {
            window.open('/security/logs', '_blank');
        },
        
        async extendSession() {
            this.showSecurityAlert(
                'Extend Session',
                'Do you want to extend your current session? This will keep you logged in for additional time.',
                'bi-clock-history',
                'Extend Session',
                'btn-success',
                'bi-check-circle',
                async () => {
                    try {
                        const response = await fetch('/api/session/extend', {
                            method: 'POST'
                        });
                        const data = await response.json();
                        
                        if (data.success) {
                            this.showNotification('Session extended successfully', 'success');
                            await this.loadSecurityStatus();
                        } else {
                            this.showNotification(data.message || 'Failed to extend session', 'error');
                        }
                    } catch (error) {
                        this.showNotification('Error extending session', 'error');
                    }
                }
            );
        },
        
        secureLogout() {
            this.showSecurityAlert(
                'Secure Logout',
                'Are you sure you want to logout securely? This will terminate your session and clear all local data.',
                'bi-shield-x',
                'Secure Logout',
                'btn-danger',
                'bi-box-arrow-right',
                () => {
                    // Clear local storage
                    localStorage.clear();
                    sessionStorage.clear();
                    
                    // Redirect to logout
                    window.location.href = '/auth/logout';
                }
            );
        },
        
        showSecurityAlert(title, message, icon, buttonText, buttonClass, buttonIcon, action) {
            this.securityAlertTitle = title;
            this.securityAlertMessage = message;
            this.securityAlertIcon = icon;
            this.securityAlertButtonText = buttonText;
            this.securityAlertButtonClass = buttonClass;
            this.securityAlertButtonIcon = buttonIcon;
            this.securityAlertAction = action;
            this.showSecurityAlert = true;
        },
        
        closeSecurityAlert() {
            this.showSecurityAlert = false;
            this.securityAlertAction = null;
        },
        
        confirmSecurityAction() {
            if (this.securityAlertAction) {
                this.securityAlertAction();
            }
            this.closeSecurityAlert();
        },
        
        showNotification(message, type) {
            // Dispatch event for global notification system
            document.dispatchEvent(new CustomEvent('showNotification', {
                detail: { message, type }
            }));
        }
    };
}
</script>
