<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS/TDS Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .deduction-card {
            transition: all 0.3s ease;
            border-left: 4px solid #6f42c1;
        }
        .deduction-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-deposited { color: #28a745; }
        .status-pending { color: #ffc107; }
        .status-overdue { color: #dc3545; }
        .status-processing { color: #17a2b8; }
        .view-toggle .btn {
            border-radius: 0;
        }
        .view-toggle .btn:first-child {
            border-radius: 0.375rem 0 0 0.375rem;
        }
        .view-toggle .btn:last-child {
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .deduction-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }
        .filter-section {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .bulk-actions {
            background-color: #e9ecef;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light" x-data="tdsTcsList()">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h3 mb-0">TCS/TDS Transactions</h1>
                        <p class="text-muted mb-0">Manage and track TCS/TDS deductions and deposits</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" @click="exportData()">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <button class="btn btn-primary" @click="navigateTo('form')">
                            <i class="bi bi-plus-circle"></i> New Deduction
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Metrics -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_TCS_TDS')">
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary" x-text="totalDeductions"></h5>
                        <p class="card-text">Total Deductions</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success" x-text="depositedDeductions"></h5>
                        <p class="card-text">Deposited</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning" x-text="pendingDeductions"></h5>
                        <p class="card-text">Pending</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info" x-text="totalTaxAmount"></h5>
                        <p class="card-text">Total Tax (₹)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filter-section" x-show="isFeatureEnabled('FEATURE_TCS_TDS')">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Search</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search deductions..." x-model="filters.search">
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Type</label>
                    <select class="form-select" x-model="filters.type">
                        <option value="">All Types</option>
                        <option value="tds">TDS</option>
                        <option value="tcs">TCS</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" x-model="filters.status">
                        <option value="">All Status</option>
                        <option value="deposited">Deposited</option>
                        <option value="pending">Pending</option>
                        <option value="overdue">Overdue</option>
                        <option value="processing">Processing</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Section</label>
                    <select class="form-select" x-model="filters.section">
                        <option value="">All Sections</option>
                        <option value="194C">194C</option>
                        <option value="194I">194I</option>
                        <option value="194J">194J</option>
                        <option value="206C">206C</option>
                        <option value="206CA">206CA</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date Range</label>
                    <div class="input-group">
                        <input type="date" class="form-control" x-model="filters.startDate">
                        <input type="date" class="form-control" x-model="filters.endDate">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <button class="btn btn-primary" @click="applyFilters">
                        <i class="bi bi-funnel"></i> Apply Filters
                    </button>
                    <button class="btn btn-outline-secondary ms-2" @click="resetFilters">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" x-show="isFeatureEnabled('FEATURE_TCS_TDS') && selectedDeductions.length > 0">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="me-2">Selected: <strong x-text="selectedDeductions.length"></strong> deductions</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-success" @click="bulkDeposit">
                        <i class="bi bi-cash"></i> Deposit Tax
                    </button>
                    <button class="btn btn-sm btn-warning" @click="bulkProcess">
                        <i class="bi bi-gear"></i> Process
                    </button>
                    <button class="btn btn-sm btn-info" @click="bulkExport">
                        <i class="bi bi-download"></i> Export
                    </button>
                    <button class="btn btn-sm btn-danger" @click="bulkDelete">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>

        <!-- View Toggle and Pagination -->
        <div class="row mb-3" x-show="isFeatureEnabled('FEATURE_TCS_TDS')">
            <div class="col-md-6">
                <div class="view-toggle btn-group" role="group">
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'grid' }"
                            @click="viewMode = 'grid'">
                        <i class="bi bi-grid-3x3-gap"></i> Grid
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'list' }"
                            @click="viewMode = 'list'">
                        <i class="bi bi-list-ul"></i> List
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'table' }"
                            @click="viewMode = 'table'">
                        <i class="bi bi-table"></i> Table
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <div class="d-inline-flex align-items-center">
                    <label class="form-label me-2 mb-0">Items per page:</label>
                    <select class="form-select form-select-sm" style="width: auto;" x-model="itemsPerPage" @change="updatePagination">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Grid View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_TCS_TDS') && viewMode === 'grid'">
            <template x-for="deduction in paginatedDeductions" :key="deduction.id">
                <div class="col-md-4 mb-3">
                    <div class="deduction-card card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0" x-text="deduction.payer"></h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       :value="deduction.id" 
                                       x-model="selectedDeductions">
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="mb-2">
                                <span class="badge deduction-badge" 
                                      :style="`background-color: ${deduction.typeColor}`"
                                      x-text="deduction.type"></span>
                                <span class="badge ms-1" 
                                      :class="{
                                          'bg-success': deduction.status === 'Deposited',
                                          'bg-warning': deduction.status === 'Pending',
                                          'bg-danger': deduction.status === 'Overdue',
                                          'bg-info': deduction.status === 'Processing'
                                      }" 
                                      x-text="deduction.status"></span>
                            </div>
                            <p class="card-text small text-muted" x-text="deduction.description"></p>
                            <div class="row small">
                                <div class="col-6">
                                    <strong>Section:</strong> <span x-text="deduction.section"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Rate:</strong> <span x-text="deduction.rate + '%'"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Amount:</strong> ₹<span x-text="deduction.amount.toLocaleString('en-IN')"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Tax Amount:</strong> ₹<span x-text="deduction.taxAmount.toLocaleString('en-IN')"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Due Date:</strong> <span x-text="deduction.dueDate"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Deposit Date:</strong> <span x-text="deduction.depositDate || 'Not deposited'"></span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="btn-group w-100" role="group">
                                <button class="btn btn-sm btn-outline-primary" @click="viewDeduction(deduction)">
                                    <i class="bi bi-eye"></i> View
                                </button>
                                <button class="btn btn-sm btn-outline-success" @click="editDeduction(deduction)">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger" @click="deleteDeduction(deduction)">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- List View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_TCS_TDS') && viewMode === 'list'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <template x-for="deduction in paginatedDeductions" :key="deduction.id">
                                <div class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center">
                                            <div class="form-check me-3">
                                                <input class="form-check-input" type="checkbox" 
                                                       :value="deduction.id" 
                                                       x-model="selectedDeductions">
                                            </div>
                                            <div>
                                                <h6 class="mb-1" x-text="deduction.payer"></h6>
                                                <p class="mb-1 text-muted small" x-text="deduction.description"></p>
                                                <div>
                                                    <span class="badge deduction-badge me-1" 
                                                          :style="`background-color: ${deduction.typeColor}`"
                                                          x-text="deduction.type"></span>
                                                    <span class="badge me-1" 
                                                          :class="{
                                                              'bg-success': deduction.status === 'Deposited',
                                                              'bg-warning': deduction.status === 'Pending',
                                                              'bg-danger': deduction.status === 'Overdue',
                                                              'bg-info': deduction.status === 'Processing'
                                                          }" 
                                                          x-text="deduction.status"></span>
                                                    <small class="text-muted">
                                                        Section: <span x-text="deduction.section"></span> | 
                                                        Rate: <span x-text="deduction.rate + '%'"></span> | 
                                                        Amount: ₹<span x-text="deduction.amount.toLocaleString('en-IN')"></span> | 
                                                        Due: <span x-text="deduction.dueDate"></span>
                                                    </small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-primary" @click="viewDeduction(deduction)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" @click="editDeduction(deduction)">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" @click="deleteDeduction(deduction)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_TCS_TDS') && viewMode === 'table'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" 
                                                       @change="toggleSelectAll"
                                                       :checked="selectedDeductions.length === paginatedDeductions.length">
                                            </div>
                                        </th>
                                        <th @click="sortBy('payer')" style="cursor: pointer;">
                                            Payer <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('type')" style="cursor: pointer;">
                                            Type <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('section')" style="cursor: pointer;">
                                            Section <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('amount')" style="cursor: pointer;">
                                            Amount <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('taxAmount')" style="cursor: pointer;">
                                            Tax Amount <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('status')" style="cursor: pointer;">
                                            Status <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('dueDate')" style="cursor: pointer;">
                                            Due Date <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="deduction in paginatedDeductions" :key="deduction.id">
                                        <tr>
                                            <td>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" 
                                                           :value="deduction.id" 
                                                           x-model="selectedDeductions">
                                                </div>
                                            </td>
                                            <td x-text="deduction.payer"></td>
                                            <td>
                                                <span class="badge deduction-badge" 
                                                      :style="`background-color: ${deduction.typeColor}`"
                                                      x-text="deduction.type"></span>
                                            </td>
                                            <td x-text="deduction.section"></td>
                                            <td>₹<span x-text="deduction.amount.toLocaleString('en-IN')"></span></td>
                                            <td>₹<span x-text="deduction.taxAmount.toLocaleString('en-IN')"></span></td>
                                            <td>
                                                <span class="badge" 
                                                      :class="{
                                                          'bg-success': deduction.status === 'Deposited',
                                                          'bg-warning': deduction.status === 'Pending',
                                                          'bg-danger': deduction.status === 'Overdue',
                                                          'bg-info': deduction.status === 'Processing'
                                                      }" 
                                                      x-text="deduction.status"></span>
                                            </td>
                                            <td x-text="deduction.dueDate"></td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-primary" @click="viewDeduction(deduction)">
                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button class="btn btn-outline-success" @click="editDeduction(deduction)">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger" @click="deleteDeduction(deduction)">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="row" x-show="isFeatureEnabled('FEATURE_TCS_TDS')">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <span class="me-2">Showing <span x-text="startIndex + 1"></span> to <span x-text="endIndex"></span> of <span x-text="filteredDeductions.length"></span> entries</span>
                </div>
            </div>
            <div class="col-md-6">
                <nav>
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage = 1" :disabled="currentPage === 1">First</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage--" :disabled="currentPage === 1">Previous</button>
                        </li>
                        <template x-for="page in visiblePages" :key="page">
                            <li class="page-item" :class="{ 'active': page === currentPage }">
                                <button class="page-link" @click="currentPage = page" x-text="page"></button>
                            </li>
                        </template>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage++" :disabled="currentPage === totalPages">Next</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage = totalPages" :disabled="currentPage === totalPages">Last</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function tdsTcsList() {
            return {
                viewMode: 'grid',
                selectedDeductions: [],
                currentPage: 1,
                itemsPerPage: 10,
                sortField: 'payer',
                sortDirection: 'asc',
                filters: {
                    search: '',
                    type: '',
                    status: '',
                    section: '',
                    startDate: '',
                    endDate: ''
                },
                deductions: [
                    { id: 1, payer: 'ABC Services Ltd.', type: 'TDS', section: '194C', amount: 50000, taxAmount: 2500, status: 'Pending', typeColor: '#6f42c1', dueDate: '2024-01-20', depositDate: null, description: 'Commission payment to agents' },
                    { id: 2, payer: 'Tech Solutions Inc.', type: 'TDS', section: '194I', amount: 75000, taxAmount: 7500, status: 'Deposited', typeColor: '#6f42c1', dueDate: '2024-01-18', depositDate: '2024-01-17', description: 'Professional fees for consultancy' },
                    { id: 3, payer: 'Retail Store Chain', type: 'TCS', section: '206C', amount: 100000, taxAmount: 1000, status: 'Pending', typeColor: '#0d6efd', dueDate: '2024-01-25', depositDate: null, description: 'Tax collected on sale of goods' },
                    { id: 4, payer: 'Car Dealership', type: 'TCS', section: '206CA', amount: 120000, taxAmount: 1200, status: 'Overdue', typeColor: '#0d6efd', dueDate: '2024-01-15', depositDate: null, description: 'Tax collected on motor vehicle sale' },
                    { id: 5, payer: 'Freight Logistics', type: 'TDS', section: '194J', amount: 35000, taxAmount: 1750, status: 'Processing', typeColor: '#6f42c1', dueDate: '2024-01-22', depositDate: null, description: 'Technical services for logistics' },
                    { id: 6, payer: 'Legal Associates', type: 'TDS', section: '194I', amount: 60000, taxAmount: 6000, status: 'Deposited', typeColor: '#6f42c1', dueDate: '2024-01-10', depositDate: '2024-01-09', description: 'Legal consultation services' },
                    { id: 7, payer: 'Supermarket Chain', type: 'TCS', section: '206C', amount: 80000, taxAmount: 800, status: 'Pending', typeColor: '#0d6efd', dueDate: '2024-01-28', depositDate: null, description: 'Tax collected on retail sales' },
                    { id: 8, payer: 'IT Services Ltd.', type: 'TDS', section: '194C', amount: 45000, taxAmount: 2250, status: 'Deposited', typeColor: '#6f42c1', dueDate: '2024-01-05', depositDate: '2024-01-04', description: 'Commission payments to sales agents' }
                ],
                
                get totalDeductions() {
                    return this.deductions.length;
                },
                
                get depositedDeductions() {
                    return this.deductions.filter(d => d.status === 'Deposited').length;
                },
                
                get pendingDeductions() {
                    return this.deductions.filter(d => d.status === 'Pending').length;
                },
                
                get totalTaxAmount() {
                    return this.deductions.reduce((total, deduction) => total + deduction.taxAmount, 0).toLocaleString('en-IN');
                },
                
                get filteredDeductions() {
                    return this.deductions.filter(deduction => {
                        if (this.filters.search && !deduction.payer.toLowerCase().includes(this.filters.search.toLowerCase())) {
                            return false;
                        }
                        if (this.filters.type && deduction.type !== this.filters.type) {
                            return false;
                        }
                        if (this.filters.status && deduction.status !== this.filters.status) {
                            return false;
                        }
                        if (this.filters.section && deduction.section !== this.filters.section) {
                            return false;
                        }
                        return true;
                    }).sort((a, b) => {
                        let aVal = a[this.sortField];
                        let bVal = b[this.sortField];
                        
                        if (this.sortDirection === 'asc') {
                            return aVal > bVal ? 1 : -1;
                        } else {
                            return aVal < bVal ? 1 : -1;
                        }
                    });
                },
                
                get paginatedDeductions() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    const end = start + this.itemsPerPage;
                    return this.filteredDeductions.slice(start, end);
                },
                
                get totalPages() {
                    return Math.ceil(this.filteredDeductions.length / this.itemsPerPage);
                },
                
                get startIndex() {
                    return (this.currentPage - 1) * this.itemsPerPage;
                },
                
                get endIndex() {
                    return Math.min(this.startIndex + this.itemsPerPage, this.filteredDeductions.length);
                },
                
                get visiblePages() {
                    const pages = [];
                    const maxVisible = 5;
                    const half = Math.floor(maxVisible / 2);
                    
                    let start = Math.max(1, this.currentPage - half);
                    let end = Math.min(this.totalPages, start + maxVisible - 1);
                    
                    if (end - start + 1 < maxVisible) {
                        start = Math.max(1, end - maxVisible + 1);
                    }
                    
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    
                    return pages;
                },
                
                isFeatureEnabled(feature) {
                    return true;
                },
                
                sortBy(field) {
                    if (this.sortField === field) {
                        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        this.sortField = field;
                        this.sortDirection = 'asc';
                    }
                },
                
                toggleSelectAll() {
                    if (this.selectedDeductions.length === this.paginatedDeductions.length) {
                        this.selectedDeductions = [];
                    } else {
                        this.selectedDeductions = this.paginatedDeductions.map(deduction => deduction.id);
                    }
                },
                
                applyFilters() {
                    this.currentPage = 1;
                },
                
                resetFilters() {
                    this.filters = {
                        search: '',
                        type: '',
                        status: '',
                        section: '',
                        startDate: '',
                        endDate: ''
                    };
                    this.currentPage = 1;
                },
                
                updatePagination() {
                    this.currentPage = 1;
                },
                
                viewDeduction(deduction) {
                    console.log('Viewing deduction:', deduction);
                },
                
                editDeduction(deduction) {
                    console.log('Editing deduction:', deduction);
                },
                
                deleteDeduction(deduction) {
                    if (confirm(`Are you sure you want to delete ${deduction.payer} deduction?`)) {
                        console.log('Deleting deduction:', deduction);
                    }
                },
                
                bulkDeposit() {
                    console.log('Bulk depositing deductions:', this.selectedDeductions);
                },
                
                bulkProcess() {
                    console.log('Bulk processing deductions:', this.selectedDeductions);
                },
                
                bulkExport() {
                    console.log('Bulk exporting deductions:', this.selectedDeductions);
                },
                
                bulkDelete() {
                    if (confirm(`Are you sure you want to delete ${this.selectedDeductions.length} deductions?`)) {
                        console.log('Bulk deleting deductions:', this.selectedDeductions);
                    }
                },
                
                exportData() {
                    console.log('Exporting all deductions data');
                },
                
                navigateTo(page) {
                    window.location.href = `/features/billing_taxation/tcs_tds_${page}.html`;
                }
            }
        }
    </script>
