<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Invoice Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
        .invoice-card {
            transition: all 0.3s ease;
            border-left: 4px solid #17a2b8;
        }
        .invoice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }
        .filter-section {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .view-toggle .btn {
            border-radius: 0;
        }
        .view-toggle .btn:first-child {
            border-top-left-radius: 0.375rem;
            border-bottom-left-radius: 0.375rem;
        }
        .view-toggle .btn:last-child {
            border-top-right-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
        }
        .grid-view .invoice-card {
            height: 100%;
        }
        .bulk-actions {
            position: sticky;
            bottom: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-light" x-data="eInvoiceList()">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h3 mb-0">E-Invoice Records</h1>
                        <p class="text-muted mb-0">Manage and track all electronic invoices</p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="btn-group view-toggle" role="group">
                            <button type="button" class="btn btn-outline-primary" 
                                    :class="{ 'active': viewMode === 'table' }"
                                    @click="viewMode = 'table'">
                                <i class="bi bi-table"></i> Table
                            </button>
                            <button type="button" class="btn btn-outline-primary" 
                                    :class="{ 'active': viewMode === 'grid' }"
                                    @click="viewMode = 'grid'">
                                <i class="bi bi-grid-3x3-gap"></i> Grid
                            </button>
                        </div>
                        <button class="btn btn-primary" @click="generateNewInvoice()">
                            <i class="bi bi-plus-circle"></i> New E-Invoice
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filter-section" x-show="isFeatureEnabled('FEATURE_E_INVOICE')">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Date Range</label>
                    <select class="form-select" x-model="filters.dateRange" @change="applyFilters">
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                        <option value="quarter">This Quarter</option>
                        <option value="year">This Year</option>
                        <option value="custom">Custom Range</option>
                    </select>
                </div>
                <div class="col-md-2" x-show="filters.dateRange === 'custom'">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" x-model="filters.startDate" @change="applyFilters">
                </div>
                <div class="col-md-2" x-show="filters.dateRange === 'custom'">
                    <label class="form-label">End Date</label>
                    <input type="date" class="form-control" x-model="filters.endDate" @change="applyFilters">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" x-model="filters.status" @change="applyFilters">
                        <option value="">All Status</option>
                        <option value="Generated">Generated</option>
                        <option value="Pending">Pending</option>
                        <option value="Failed">Failed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Customer</label>
                    <input type="text" class="form-control" x-model="filters.customer" @input="applyFilters" placeholder="Search customer">
                </div>
                <div class="col-md-2">
                    <label class="form-label">IRN/Invoice No.</label>
                    <input type="text" class="form-control" x-model="filters.search" @input="applyFilters" placeholder="Search...">
                </div>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" x-show="selectedInvoices.length > 0 && isFeatureEnabled('FEATURE_E_INVOICE')">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="me-2"><strong x-text="selectedInvoices.length"></strong> invoices selected</span>
                            <button class="btn btn-sm btn-outline-danger me-2" @click="bulkCancel()">
                                <i class="bi bi-x-circle"></i> Cancel IRN
                            </button>
                            <button class="btn btn-sm btn-outline-success me-2" @click="bulkDownload()">
                                <i class="bi bi-download"></i> Download
                            </button>
                            <button class="btn btn-sm btn-outline-primary" @click="bulkResend()">
                                <i class="bi bi-arrow-repeat"></i> Resend
                            </button>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" @click="clearSelection()">
                            Clear Selection
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div x-show="viewMode === 'table' && isFeatureEnabled('FEATURE_E_INVOICE')">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Invoice List</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-primary" @click="refreshData()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-download"></i> Export
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" @click="exportData('excel')">
                                    <i class="bi bi-file-excel"></i> Excel
                                </a></li>
                                <li><a class="dropdown-item" href="#" @click="exportData('pdf')">
                                    <i class="bi bi-file-pdf"></i> PDF
                                </a></li>
                                <li><a class="dropdown-item" href="#" @click="exportData('csv')">
                                    <i class="bi bi-file-csv"></i> CSV
                                </a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>
                                        <input type="checkbox" class="form-check-input" 
                                               :checked="selectedInvoices.length === filteredInvoices.length"
                                               @change="toggleSelectAll">
                                    </th>
                                    <th @click="sortBy('irn')" style="cursor: pointer;">
                                        IRN <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th @click="sortBy('invoiceNo')" style="cursor: pointer;">
                                        Invoice No. <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th @click="sortBy('customer')" style="cursor: pointer;">
                                        Customer <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th @click="sortBy('amount')" style="cursor: pointer;">
                                        Amount <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th @click="sortBy('status')" style="cursor: pointer;">
                                        Status <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th @click="sortBy('generated')" style="cursor: pointer;">
                                        Generated <i class="bi bi-arrow-down-up"></i>
                                    </th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="invoice in paginatedInvoices" :key="invoice.id">
                                    <tr>
                                        <td>
                                            <input type="checkbox" class="form-check-input" 
                                                   :checked="selectedInvoices.includes(invoice.id)"
                                                   @change="toggleSelection(invoice.id)">
                                        </td>
                                        <td x-text="invoice.irn"></td>
                                        <td x-text="invoice.invoiceNo"></td>
                                        <td x-text="invoice.customer"></td>
                                        <td>₹<span x-text="invoice.amount.toLocaleString('en-IN')"></span></td>
                                        <td>
                                            <span class="badge status-badge" 
                                                  :class="{
                                                      'bg-success': invoice.status === 'Generated',
                                                      'bg-warning': invoice.status === 'Pending',
                                                      'bg-danger': invoice.status === 'Failed',
                                                      'bg-info': invoice.status === 'Cancelled'
                                                  }"
                                                  x-text="invoice.status"></span>
                                        </td>
                                        <td x-text="invoice.generated"></td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <button class="btn btn-outline-primary" @click="viewInvoice(invoice)">
                                                    <i class="bi bi-eye"></i>
                                                </button>
                                                <button class="btn btn-outline-success" @click="downloadInvoice(invoice)">
                                                    <i class="bi bi-download"></i>
                                                </button>
                                                <button class="btn btn-outline-warning" @click="resendInvoice(invoice)" 
                                                        x-show="invoice.status === 'Failed'">
                                                    <i class="bi bi-arrow-repeat"></i>
                                                </button>
                                                <button class="btn btn-outline-danger" @click="cancelInvoice(invoice)"
                                                        x-show="invoice.status === 'Generated'">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid View -->
        <div class="grid-view row" x-show="viewMode === 'grid' && isFeatureEnabled('FEATURE_E_INVOICE')">
            <template x-for="invoice in paginatedInvoices" :key="invoice.id">
                <div class="col-md-4 mb-3">
                    <div class="invoice-card card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="badge status-badge" 
                                  :class="{
                                      'bg-success': invoice.status === 'Generated',
                                      'bg-warning': invoice.status === 'Pending',
                                      'bg-danger': invoice.status === 'Failed',
                                      'bg-info': invoice.status === 'Cancelled'
                                  }"
                                  x-text="invoice.status"></span>
                            <input type="checkbox" class="form-check-input" 
                                   :checked="selectedInvoices.includes(invoice.id)"
                                   @change="toggleSelection(invoice.id)">
                        </div>
                        <div class="card-body">
                            <h6 class="card-title" x-text="invoice.invoiceNo"></h6>
                            <p class="text-muted small mb-1" x-text="invoice.irn"></p>
                            <p class="mb-1"><strong>Customer:</strong> <span x-text="invoice.customer"></span></p>
                            <p class="mb-1"><strong>Amount:</strong> ₹<span x-text="invoice.amount.toLocaleString('en-IN')"></span></p>
                            <p class="mb-1"><strong>Generated:</strong> <span x-text="invoice.generated"></span></p>
                        </div>
                        <div class="card-footer">
                            <div class="btn-group btn-group-sm w-100">
                                <button class="btn btn-outline-primary" @click="viewInvoice(invoice)">
                                    <i class="bi bi-eye"></i> View
                                </button>
                                <button class="btn btn-outline-success" @click="downloadInvoice(invoice)">
                                    <i class="bi bi-download"></i> Download
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Pagination -->
        <div class="row mt-4" x-show="isFeatureEnabled('FEATURE_E_INVOICE')">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <span class="me-2">Showing <span x-text="startIndex + 1"></span> to <span x-text="endIndex"></span> of <span x-text="filteredInvoices.length"></span> entries</span>
                </div>
            </div>
            <div class="col-md-6">
                <nav>
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage = 1" :disabled="currentPage === 1">First</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage--" :disabled="currentPage === 1">Previous</button>
                        </li>
                        <template x-for="page in visiblePages" :key="page">
                            <li class="page-item" :class="{ 'active': page === currentPage }">
                                <button class="page-link" @click="currentPage = page" x-text="page"></button>
                            </li>
                        </template>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage++" :disabled="currentPage === totalPages">Next</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage = totalPages" :disabled="currentPage === totalPages">Last</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function eInvoiceList() {
            return {
                viewMode: 'table',
                currentPage: 1,
                itemsPerPage: 10,
                sortField: 'generated',
                sortDirection: 'desc',
                selectedInvoices: [],
                filters: {
                    dateRange: 'month',
                    startDate: '',
                    endDate: '',
                    status: '',
                    customer: '',
                    search: ''
                },
                invoices: [
                    { id: 1, irn: 'IRN2023120001234', invoiceNo: 'INV-2023-001', customer: 'ABC Trading Co.', amount: 125000, status: 'Generated', generated: '2023-12-16 10:30' },
                    { id: 2, irn: 'IRN2023120001235', invoiceNo: 'INV-2023-002', customer: 'Tech Solutions Ltd.', amount: 87500, status: 'Generated', generated: '2023-12-16 09:45' },
                    { id: 3, irn: '-', invoiceNo: 'INV-2023-003', customer: 'Global Exports', amount: 234000, status: 'Pending', generated: '-' },
                    { id: 4, irn: 'IRN2023120001236', invoiceNo: 'INV-2023-004', customer: 'Metro Stores', amount: 156000, status: 'Generated', generated: '2023-12-16 08:20' },
                    { id: 5, irn: 'IRN2023120001232', invoiceNo: 'INV-2023-005', customer: 'Fast Logistics', amount: 67000, status: 'Cancelled', generated: '2023-12-15 16:30' },
                    { id: 6, irn: '-', invoiceNo: 'INV-2023-006', customer: 'Retail Chain', amount: 189000, status: 'Failed', generated: '-' },
                    { id: 7, irn: 'IRN2023120001230', invoiceNo: 'INV-2023-007', customer: 'Wholesale Mart', amount: 98000, status: 'Generated', generated: '2023-12-15 14:15' },
                    { id: 8, irn: 'IRN2023120001231', invoiceNo: 'INV-2023-008', customer: 'Industrial Supplies', amount: 267000, status: 'Generated', generated: '2023-12-15 11:40' },
                    { id: 9, irn: '-', invoiceNo: 'INV-2023-009', customer: 'Construction Co.', amount: 445000, status: 'Pending', generated: '-' },
                    { id: 10, irn: 'IRN2023120001229', invoiceNo: 'INV-2023-010', customer: 'Medical Supplies', amount: 178000, status: 'Generated', generated: '2023-12-15 09:25' },
                    { id: 11, irn: 'IRN2023120001228', invoiceNo: 'INV-2023-011', customer: 'Food Processing', amount: 134000, status: 'Generated', generated: '2023-12-14 16:50' },
                    { id: 12, irn: '-', invoiceNo: 'INV-2023-012', customer: 'Textile Industry', amount: 223000, status: 'Failed', generated: '-' }
                ],
                
                get filteredInvoices() {
                    return this.invoices.filter(invoice => {
                        if (this.filters.status && invoice.status !== this.filters.status) {
                            return false;
                        }
                        if (this.filters.customer && !invoice.customer.toLowerCase().includes(this.filters.customer.toLowerCase())) {
                            return false;
                        }
                        if (this.filters.search && !invoice.invoiceNo.toLowerCase().includes(this.filters.search.toLowerCase()) && 
                            !invoice.irn.toLowerCase().includes(this.filters.search.toLowerCase())) {
                            return false;
                        }
                        return true;
                    }).sort((a, b) => {
                        let aVal = a[this.sortField];
                        let bVal = b[this.sortField];
                        
                        if (this.sortDirection === 'asc') {
                            return aVal > bVal ? 1 : -1;
                        } else {
                            return aVal < bVal ? 1 : -1;
                        }
                    });
                },
                
                get paginatedInvoices() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    const end = start + this.itemsPerPage;
                    return this.filteredInvoices.slice(start, end);
                },
                
                get totalPages() {
                    return Math.ceil(this.filteredInvoices.length / this.itemsPerPage);
                },
                
                get startIndex() {
                    return (this.currentPage - 1) * this.itemsPerPage;
                },
                
                get endIndex() {
                    return Math.min(this.startIndex + this.itemsPerPage, this.filteredInvoices.length);
                },
                
                get visiblePages() {
                    const pages = [];
                    const maxVisible = 5;
                    const half = Math.floor(maxVisible / 2);
                    
                    let start = Math.max(1, this.currentPage - half);
                    let end = Math.min(this.totalPages, start + maxVisible - 1);
                    
                    if (end - start + 1 < maxVisible) {
                        start = Math.max(1, end - maxVisible + 1);
                    }
                    
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    
                    return pages;
                },
                
                isFeatureEnabled(feature) {
                    return true;
                },
                
                applyFilters() {
                    this.currentPage = 1;
                },
                
                sortBy(field) {
                    if (this.sortField === field) {
                        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        this.sortField = field;
                        this.sortDirection = 'asc';
                    }
                },
                
                toggleSelection(invoiceId) {
                    const index = this.selectedInvoices.indexOf(invoiceId);
                    if (index > -1) {
                        this.selectedInvoices.splice(index, 1);
                    } else {
                        this.selectedInvoices.push(invoiceId);
                    }
                },
                
                toggleSelectAll() {
                    if (this.selectedInvoices.length === this.filteredInvoices.length) {
                        this.selectedInvoices = [];
                    } else {
                        this.selectedInvoices = this.filteredInvoices.map(invoice => invoice.id);
                    }
                },
                
                clearSelection() {
                    this.selectedInvoices = [];
                },
                
                generateNewInvoice() {
                    console.log('Generating new e-invoice');
                    window.location.href = 'e_invoice_form.html';
                },
                
                viewInvoice(invoice) {
                    console.log('Viewing invoice:', invoice);
                },
                
                downloadInvoice(invoice) {
                    console.log('Downloading invoice:', invoice);
                },
                
                resendInvoice(invoice) {
                    console.log('Resending invoice:', invoice);
                    alert('Invoice resent successfully!');
                },
                
                cancelInvoice(invoice) {
                    console.log('Cancelling invoice:', invoice);
                    if (confirm('Are you sure you want to cancel this IRN?')) {
                        alert('IRN cancelled successfully!');
                    }
                },
                
                bulkCancel() {
                    console.log('Bulk cancelling invoices:', this.selectedInvoices);
                    if (confirm(`Are you sure you want to cancel ${this.selectedInvoices.length} IRNs?`)) {
                        alert('Bulk cancellation initiated successfully!');
                        this.clearSelection();
                    }
                },
                
                bulkDownload() {
                    console.log('Bulk downloading invoices:', this.selectedInvoices);
                    alert('Bulk download initiated successfully!');
                },
                
                bulkResend() {
                    console.log('Bulk resending invoices:', this.selectedInvoices);
                    alert('Bulk resend initiated successfully!');
                    this.clearSelection();
                },
                
                refreshData() {
                    console.log('Refreshing data');
                    alert('Data refreshed successfully!');
                },
                
                exportData(format) {
                    console.log('Exporting data as:', format);
                    alert(`Data exported as ${format.toUpperCase()} successfully!`);
                }
            }
        }
    </script>
</body>
</html>
