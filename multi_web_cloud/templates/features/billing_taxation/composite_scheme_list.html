<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composite Scheme Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .scheme-card {
            transition: all 0.3s ease;
            border-left: 4px solid #fd7e14;
        }
        .scheme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-active { color: #28a745; }
        .status-pending { color: #ffc107; }
        .status-suspended { color: #dc3545; }
        .status-expired { color: #6c757d; }
        .view-toggle .btn {
            border-radius: 0;
        }
        .view-toggle .btn:first-child {
            border-radius: 0.375rem 0 0 0.375rem;
        }
        .view-toggle .btn:last-child {
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .scheme-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }
        .filter-section {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .bulk-actions {
            background-color: #e9ecef;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light" x-data="compositeSchemeList()">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h3 mb-0">Composite Scheme Records</h1>
                        <p class="text-muted mb-0">Manage and track composite tax schemes</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" @click="exportData()">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <button class="btn btn-primary" @click="navigateTo('form')">
                            <i class="bi bi-plus-circle"></i> New Scheme
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Metrics -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME')">
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary" x-text="totalSchemes"></h5>
                        <p class="card-text">Total Schemes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success" x-text="activeSchemes"></h5>
                        <p class="card-text">Active Schemes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning" x-text="pendingSchemes"></h5>
                        <p class="card-text">Pending Schemes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info" x-text="totalTaxSaved"></h5>
                        <p class="card-text">Tax Saved (₹)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filter-section" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME')">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Search</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search schemes..." x-model="filters.search">
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Scheme Type</label>
                    <select class="form-select" x-model="filters.type">
                        <option value="">All Types</option>
                        <option value="manufacturer">Manufacturer</option>
                        <option value="restaurant">Restaurant</option>
                        <option value="service">Service Provider</option>
                        <option value="retailer">Retailer</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" x-model="filters.status">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="suspended">Suspended</option>
                        <option value="expired">Expired</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tax Rate</label>
                    <select class="form-select" x-model="filters.taxRate">
                        <option value="">All Rates</option>
                        <option value="1">1%</option>
                        <option value="1.5">1.5%</option>
                        <option value="6">6%</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date Range</label>
                    <div class="input-group">
                        <input type="date" class="form-control" x-model="filters.startDate">
                        <input type="date" class="form-control" x-model="filters.endDate">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <button class="btn btn-primary" @click="applyFilters">
                        <i class="bi bi-funnel"></i> Apply Filters
                    </button>
                    <button class="btn btn-outline-secondary ms-2" @click="resetFilters">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME') && selectedSchemes.length > 0">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="me-2">Selected: <strong x-text="selectedSchemes.length"></strong> schemes</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-success" @click="bulkActivate">
                        <i class="bi bi-check-circle"></i> Activate
                    </button>
                    <button class="btn btn-sm btn-warning" @click="bulkSuspend">
                        <i class="bi bi-pause-circle"></i> Suspend
                    </button>
                    <button class="btn btn-sm btn-danger" @click="bulkDelete">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                    <button class="btn btn-sm btn-info" @click="bulkExport">
                        <i class="bi bi-download"></i> Export
                    </button>
                </div>
            </div>
        </div>

        <!-- View Toggle and Pagination -->
        <div class="row mb-3" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME')">
            <div class="col-md-6">
                <div class="view-toggle btn-group" role="group">
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'grid' }"
                            @click="viewMode = 'grid'">
                        <i class="bi bi-grid-3x3-gap"></i> Grid
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'list' }"
                            @click="viewMode = 'list'">
                        <i class="bi bi-list-ul"></i> List
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'table' }"
                            @click="viewMode = 'table'">
                        <i class="bi bi-table"></i> Table
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <div class="d-inline-flex align-items-center">
                    <label class="form-label me-2 mb-0">Items per page:</label>
                    <select class="form-select form-select-sm" style="width: auto;" x-model="itemsPerPage" @change="updatePagination">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Grid View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME') && viewMode === 'grid'">
            <template x-for="scheme in paginatedSchemes" :key="scheme.id">
                <div class="col-md-4 mb-3">
                    <div class="scheme-card card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0" x-text="scheme.name"></h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       :value="scheme.id" 
                                       x-model="selectedSchemes">
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="mb-2">
                                <span class="badge scheme-badge" 
                                      :style="`background-color: ${scheme.typeColor}`"
                                      x-text="scheme.type"></span>
                                <span class="badge ms-1" 
                                      :class="{
                                          'bg-success': scheme.status === 'Active',
                                          'bg-warning': scheme.status === 'Pending',
                                          'bg-danger': scheme.status === 'Suspended',
                                          'bg-secondary': scheme.status === 'Expired'
                                      }" 
                                      x-text="scheme.status"></span>
                            </div>
                            <p class="card-text small text-muted" x-text="scheme.description"></p>
                            <div class="row small">
                                <div class="col-6">
                                    <strong>Tax Rate:</strong> <span x-text="scheme.taxRate + '%'"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Turnover Limit:</strong> ₹<span x-text="scheme.turnoverLimit.toLocaleString('en-IN')"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Effective Date:</strong> <span x-text="scheme.effectiveDate"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Expiry Date:</strong> <span x-text="scheme.expiryDate"></span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="btn-group w-100" role="group">
                                <button class="btn btn-sm btn-outline-primary" @click="viewScheme(scheme)">
                                    <i class="bi bi-eye"></i> View
                                </button>
                                <button class="btn btn-sm btn-outline-success" @click="editScheme(scheme)">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger" @click="deleteScheme(scheme)">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- List View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME') && viewMode === 'list'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <template x-for="scheme in paginatedSchemes" :key="scheme.id">
                                <div class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center">
                                            <div class="form-check me-3">
                                                <input class="form-check-input" type="checkbox" 
                                                       :value="scheme.id" 
                                                       x-model="selectedSchemes">
                                            </div>
                                            <div>
                                                <h6 class="mb-1" x-text="scheme.name"></h6>
                                                <p class="mb-1 text-muted small" x-text="scheme.description"></p>
                                                <div>
                                                    <span class="badge scheme-badge me-1" 
                                                          :style="`background-color: ${scheme.typeColor}`"
                                                          x-text="scheme.type"></span>
                                                    <span class="badge me-1" 
                                                          :class="{
                                                              'bg-success': scheme.status === 'Active',
                                                              'bg-warning': scheme.status === 'Pending',
                                                              'bg-danger': scheme.status === 'Suspended',
                                                              'bg-secondary': scheme.status === 'Expired'
                                                          }" 
                                                          x-text="scheme.status"></span>
                                                    <small class="text-muted">
                                                        Tax: <span x-text="scheme.taxRate + '%'"></span> | 
                                                        Limit: ₹<span x-text="scheme.turnoverLimit.toLocaleString('en-IN')"></span> | 
                                                        Effective: <span x-text="scheme.effectiveDate"></span>
                                                    </small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-primary" @click="viewScheme(scheme)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" @click="editScheme(scheme)">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" @click="deleteScheme(scheme)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME') && viewMode === 'table'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" 
                                                       @change="toggleSelectAll"
                                                       :checked="selectedSchemes.length === paginatedSchemes.length">
                                            </div>
                                        </th>
                                        <th @click="sortBy('name')" style="cursor: pointer;">
                                            Name <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('type')" style="cursor: pointer;">
                                            Type <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('taxRate')" style="cursor: pointer;">
                                            Tax Rate <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('turnoverLimit')" style="cursor: pointer;">
                                            Turnover Limit <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('status')" style="cursor: pointer;">
                                            Status <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('effectiveDate')" style="cursor: pointer;">
                                            Effective Date <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="scheme in paginatedSchemes" :key="scheme.id">
                                        <tr>
                                            <td>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" 
                                                           :value="scheme.id" 
                                                           x-model="selectedSchemes">
                                                </div>
                                            </td>
                                            <td x-text="scheme.name"></td>
                                            <td>
                                                <span class="badge scheme-badge" 
                                                      :style="`background-color: ${scheme.typeColor}`"
                                                      x-text="scheme.type"></span>
                                            </td>
                                            <td x-text="scheme.taxRate + '%'"></td>
                                            <td>₹<span x-text="scheme.turnoverLimit.toLocaleString('en-IN')"></span></td>
                                            <td>
                                                <span class="badge" 
                                                      :class="{
                                                          'bg-success': scheme.status === 'Active',
                                                          'bg-warning': scheme.status === 'Pending',
                                                          'bg-danger': scheme.status === 'Suspended',
                                                          'bg-secondary': scheme.status === 'Expired'
                                                      }" 
                                                      x-text="scheme.status"></span>
                                            </td>
                                            <td x-text="scheme.effectiveDate"></td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-primary" @click="viewScheme(scheme)">
                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button class="btn btn-outline-success" @click="editScheme(scheme)">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger" @click="deleteScheme(scheme)">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="row" x-show="isFeatureEnabled('FEATURE_COMPOSITE_SCHEME')">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <span class="me-2">Showing <span x-text="startIndex + 1"></span> to <span x-text="endIndex"></span> of <span x-text="filteredSchemes.length"></span> entries</span>
                </div>
            </div>
            <div class="col-md-6">
                <nav>
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage = 1" :disabled="currentPage === 1">First</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage--" :disabled="currentPage === 1">Previous</button>
                        </li>
                        <template x-for="page in visiblePages" :key="page">
                            <li class="page-item" :class="{ 'active': page === currentPage }">
                                <button class="page-link" @click="currentPage = page" x-text="page"></button>
                            </li>
                        </template>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage++" :disabled="currentPage === totalPages">Next</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage = totalPages" :disabled="currentPage === totalPages">Last</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function compositeSchemeList() {
            return {
                viewMode: 'grid',
                selectedSchemes: [],
                currentPage: 1,
                itemsPerPage: 10,
                sortField: 'name',
                sortDirection: 'asc',
                filters: {
                    search: '',
                    type: '',
                    status: '',
                    taxRate: '',
                    startDate: '',
                    endDate: ''
                },
                schemes: [
                    { id: 1, name: 'Restaurant Composite', type: 'Restaurant', taxRate: 1.5, turnoverLimit: 7500000, status: 'Active', typeColor: '#fd7e14', effectiveDate: '2023-04-01', expiryDate: '2024-03-31', description: 'Composite scheme for restaurants and food services' },
                    { id: 2, name: 'Retail Composite', type: 'Retailer', taxRate: 1.0, turnoverLimit: 1500000, status: 'Active', typeColor: '#0d6efd', effectiveDate: '2023-04-01', expiryDate: '2024-03-31', description: 'Composite scheme for retail businesses' },
                    { id: 3, name: 'Service Provider', type: 'Service', taxRate: 6.0, turnoverLimit: 2000000, status: 'Pending', typeColor: '#6f42c1', effectiveDate: '2023-04-01', expiryDate: '2024-03-31', description: 'Composite scheme for service providers' },
                    { id: 4, name: 'Manufacturer Composite', type: 'Manufacturer', taxRate: 1.0, turnoverLimit: 15000000, status: 'Active', typeColor: '#198754', effectiveDate: '2023-04-01', expiryDate: '2024-03-31', description: 'Composite scheme for manufacturers' },
                    { id: 5, name: 'Small Business Scheme', type: 'Retailer', taxRate: 1.5, turnoverLimit: 1000000, status: 'Suspended', typeColor: '#0d6efd', effectiveDate: '2023-01-01', expiryDate: '2023-12-31', description: 'Special scheme for small businesses' }
                ],
                
                get totalSchemes() {
                    return this.schemes.length;
                },
                
                get activeSchemes() {
                    return this.schemes.filter(s => s.status === 'Active').length;
                },
                
                get pendingSchemes() {
                    return this.schemes.filter(s => s.status === 'Pending').length;
                },
                
                get totalTaxSaved() {
                    return this.schemes.reduce((total, scheme) => {
                        const savings = scheme.turnoverLimit * (scheme.taxRate / 100);
                        return total + savings;
                    }, 0).toLocaleString('en-IN');
                },
                
                get filteredSchemes() {
                    return this.schemes.filter(scheme => {
                        if (this.filters.search && !scheme.name.toLowerCase().includes(this.filters.search.toLowerCase())) {
                            return false;
                        }
                        if (this.filters.type && scheme.type !== this.filters.type) {
                            return false;
                        }
                        if (this.filters.status && scheme.status !== this.filters.status) {
                            return false;
                        }
                        if (this.filters.taxRate && scheme.taxRate.toString() !== this.filters.taxRate) {
                            return false;
                        }
                        return true;
                    }).sort((a, b) => {
                        let aVal = a[this.sortField];
                        let bVal = b[this.sortField];
                        
                        if (this.sortDirection === 'asc') {
                            return aVal > bVal ? 1 : -1;
                        } else {
                            return aVal < bVal ? 1 : -1;
                        }
                    });
                },
                
                get paginatedSchemes() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    const end = start + this.itemsPerPage;
                    return this.filteredSchemes.slice(start, end);
                },
                
                get totalPages() {
                    return Math.ceil(this.filteredSchemes.length / this.itemsPerPage);
                },
                
                get startIndex() {
                    return (this.currentPage - 1) * this.itemsPerPage;
                },
                
                get endIndex() {
                    return Math.min(this.startIndex + this.itemsPerPage, this.filteredSchemes.length);
                },
                
                get visiblePages() {
                    const pages = [];
                    const maxVisible = 5;
                    const half = Math.floor(maxVisible / 2);
                    
                    let start = Math.max(1, this.currentPage - half);
                    let end = Math.min(this.totalPages, start + maxVisible - 1);
                    
                    if (end - start + 1 < maxVisible) {
                        start = Math.max(1, end - maxVisible + 1);
                    }
                    
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    
                    return pages;
                },
                
                isFeatureEnabled(feature) {
                    return true;
                },
                
                sortBy(field) {
                    if (this.sortField === field) {
                        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        this.sortField = field;
                        this.sortDirection = 'asc';
                    }
                },
                
                toggleSelectAll() {
                    if (this.selectedSchemes.length === this.paginatedSchemes.length) {
                        this.selectedSchemes = [];
                    } else {
                        this.selectedSchemes = this.paginatedSchemes.map(scheme => scheme.id);
                    }
                },
                
                applyFilters() {
                    this.currentPage = 1;
                },
                
                resetFilters() {
                    this.filters = {
                        search: '',
                        type: '',
                        status: '',
                        taxRate: '',
                        startDate: '',
                        endDate: ''
                    };
                    this.currentPage = 1;
                },
                
                updatePagination() {
                    this.currentPage = 1;
                },
                
                viewScheme(scheme) {
                    console.log('Viewing scheme:', scheme);
                },
                
                editScheme(scheme) {
                    console.log('Editing scheme:', scheme);
                },
                
                deleteScheme(scheme) {
                    if (confirm(`Are you sure you want to delete ${scheme.name}?`)) {
                        console.log('Deleting scheme:', scheme);
                    }
                },
                
                bulkActivate() {
                    console.log('Bulk activating schemes:', this.selectedSchemes);
                },
                
                bulkSuspend() {
