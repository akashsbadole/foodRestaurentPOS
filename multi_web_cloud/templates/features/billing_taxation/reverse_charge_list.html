<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Charge Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .charge-card {
            transition: all 0.3s ease;
            border-left: 4px solid #dc3545;
        }
        .charge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-paid { color: #28a745; }
        .status-pending { color: #ffc107; }
        .status-overdue { color: #dc3545; }
        .status-processing { color: #17a2b8; }
        .view-toggle .btn {
            border-radius: 0;
        }
        .view-toggle .btn:first-child {
            border-radius: 0.375rem 0 0 0.375rem;
        }
        .view-toggle .btn:last-child {
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .charge-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }
        .filter-section {
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .bulk-actions {
            background-color: #e9ecef;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light" x-data="reverseChargeList()">
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h3 mb-0">Reverse Charge Transactions</h1>
                        <p class="text-muted mb-0">Manage and track reverse charge transactions</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" @click="exportData()">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <button class="btn btn-primary" @click="navigateTo('form')">
                            <i class="bi bi-plus-circle"></i> New Charge
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Metrics -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE')">
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-danger" x-text="totalCharges"></h5>
                        <p class="card-text">Total Charges</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success" x-text="paidCharges"></h5>
                        <p class="card-text">Paid Charges</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-warning" x-text="pendingCharges"></h5>
                        <p class="card-text">Pending Charges</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info" x-text="totalTaxAmount"></h5>
                        <p class="card-text">Total Tax (₹)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filter-section" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE')">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Search</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search charges..." x-model="filters.search">
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Service Type</label>
                    <select class="form-select" x-model="filters.serviceType">
                        <option value="">All Types</option>
                        <option value="transport">Transport Services</option>
                        <option value="sponsorship">Sponsorship Services</option>
                        <option value="legal">Legal Services</option>
                        <option value="director">Director Services</option>
                        <option value="insurance">Insurance Services</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" x-model="filters.status">
                        <option value="">All Status</option>
                        <option value="paid">Paid</option>
                        <option value="pending">Pending</option>
                        <option value="overdue">Overdue</option>
                        <option value="processing">Processing</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tax Rate</label>
                    <select class="form-select" x-model="filters.taxRate">
                        <option value="">All Rates</option>
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18">18%</option>
                        <option value="28">28%</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date Range</label>
                    <div class="input-group">
                        <input type="date" class="form-control" x-model="filters.startDate">
                        <input type="date" class="form-control" x-model="filters.endDate">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <button class="btn btn-primary" @click="applyFilters">
                        <i class="bi bi-funnel"></i> Apply Filters
                    </button>
                    <button class="btn btn-outline-secondary ms-2" @click="resetFilters">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE') && selectedCharges.length > 0">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="me-2">Selected: <strong x-text="selectedCharges.length"></strong> charges</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-success" @click="bulkPay">
                        <i class="bi bi-cash"></i> Pay Tax
                    </button>
                    <button class="btn btn-sm btn-warning" @click="bulkProcess">
                        <i class="bi bi-gear"></i> Process
                    </button>
                    <button class="btn btn-sm btn-info" @click="bulkExport">
                        <i class="bi bi-download"></i> Export
                    </button>
                    <button class="btn btn-sm btn-danger" @click="bulkDelete">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>

        <!-- View Toggle and Pagination -->
        <div class="row mb-3" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE')">
            <div class="col-md-6">
                <div class="view-toggle btn-group" role="group">
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'grid' }"
                            @click="viewMode = 'grid'">
                        <i class="bi bi-grid-3x3-gap"></i> Grid
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'list' }"
                            @click="viewMode = 'list'">
                        <i class="bi bi-list-ul"></i> List
                    </button>
                    <button class="btn btn-outline-primary" 
                            :class="{ 'active': viewMode === 'table' }"
                            @click="viewMode = 'table'">
                        <i class="bi bi-table"></i> Table
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <div class="d-inline-flex align-items-center">
                    <label class="form-label me-2 mb-0">Items per page:</label>
                    <select class="form-select form-select-sm" style="width: auto;" x-model="itemsPerPage" @change="updatePagination">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Grid View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE') && viewMode === 'grid'">
            <template x-for="charge in paginatedCharges" :key="charge.id">
                <div class="col-md-4 mb-3">
                    <div class="charge-card card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0" x-text="charge.supplier"></h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       :value="charge.id" 
                                       x-model="selectedCharges">
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="mb-2">
                                <span class="badge charge-badge" 
                                      :style="`background-color: ${charge.typeColor}`"
                                      x-text="charge.serviceType"></span>
                                <span class="badge ms-1" 
                                      :class="{
                                          'bg-success': charge.status === 'Paid',
                                          'bg-warning': charge.status === 'Pending',
                                          'bg-danger': charge.status === 'Overdue',
                                          'bg-info': charge.status === 'Processing'
                                      }" 
                                      x-text="charge.status"></span>
                            </div>
                            <p class="card-text small text-muted" x-text="charge.description"></p>
                            <div class="row small">
                                <div class="col-6">
                                    <strong>Tax Rate:</strong> <span x-text="charge.taxRate + '%'"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Amount:</strong> ₹<span x-text="charge.amount.toLocaleString('en-IN')"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Tax Amount:</strong> ₹<span x-text="charge.taxAmount.toLocaleString('en-IN')"></span>
                                </div>
                                <div class="col-6">
                                    <strong>Due Date:</strong> <span x-text="charge.dueDate"></span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="btn-group w-100" role="group">
                                <button class="btn btn-sm btn-outline-primary" @click="viewCharge(charge)">
                                    <i class="bi bi-eye"></i> View
                                </button>
                                <button class="btn btn-sm btn-outline-success" @click="editCharge(charge)">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger" @click="deleteCharge(charge)">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- List View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE') && viewMode === 'list'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <template x-for="charge in paginatedCharges" :key="charge.id">
                                <div class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex align-items-center">
                                            <div class="form-check me-3">
                                                <input class="form-check-input" type="checkbox" 
                                                       :value="charge.id" 
                                                       x-model="selectedCharges">
                                            </div>
                                            <div>
                                                <h6 class="mb-1" x-text="charge.supplier"></h6>
                                                <p class="mb-1 text-muted small" x-text="charge.description"></p>
                                                <div>
                                                    <span class="badge charge-badge me-1" 
                                                          :style="`background-color: ${charge.typeColor}`"
                                                          x-text="charge.serviceType"></span>
                                                    <span class="badge me-1" 
                                                          :class="{
                                                              'bg-success': charge.status === 'Paid',
                                                              'bg-warning': charge.status === 'Pending',
                                                              'bg-danger': charge.status === 'Overdue',
                                                              'bg-info': charge.status === 'Processing'
                                                          }" 
                                                          x-text="charge.status"></span>
                                                    <small class="text-muted">
                                                        Tax: <span x-text="charge.taxRate + '%'"></span> | 
                                                        Amount: ₹<span x-text="charge.amount.toLocaleString('en-IN')"></span> | 
                                                        Due: <span x-text="charge.dueDate"></span>
                                                    </small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-primary" @click="viewCharge(charge)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-success" @click="editCharge(charge)">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" @click="deleteCharge(charge)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div class="row mb-4" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE') && viewMode === 'table'">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" 
                                                       @change="toggleSelectAll"
                                                       :checked="selectedCharges.length === paginatedCharges.length">
                                            </div>
                                        </th>
                                        <th @click="sortBy('supplier')" style="cursor: pointer;">
                                            Supplier <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('serviceType')" style="cursor: pointer;">
                                            Service Type <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('taxRate')" style="cursor: pointer;">
                                            Tax Rate <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('amount')" style="cursor: pointer;">
                                            Amount <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('taxAmount')" style="cursor: pointer;">
                                            Tax Amount <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('status')" style="cursor: pointer;">
                                            Status <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th @click="sortBy('dueDate')" style="cursor: pointer;">
                                            Due Date <i class="bi bi-arrow-down-up"></i>
                                        </th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="charge in paginatedCharges" :key="charge.id">
                                        <tr>
                                            <td>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" 
                                                           :value="charge.id" 
                                                           x-model="selectedCharges">
                                                </div>
                                            </td>
                                            <td x-text="charge.supplier"></td>
                                            <td>
                                                <span class="badge charge-badge" 
                                                      :style="`background-color: ${charge.typeColor}`"
                                                      x-text="charge.serviceType"></span>
                                            </td>
                                            <td x-text="charge.taxRate + '%'"></td>
                                            <td>₹<span x-text="charge.amount.toLocaleString('en-IN')"></span></td>
                                            <td>₹<span x-text="charge.taxAmount.toLocaleString('en-IN')"></span></td>
                                            <td>
                                                <span class="badge" 
                                                      :class="{
                                                          'bg-success': charge.status === 'Paid',
                                                          'bg-warning': charge.status === 'Pending',
                                                          'bg-danger': charge.status === 'Overdue',
                                                          'bg-info': charge.status === 'Processing'
                                                      }" 
                                                      x-text="charge.status"></span>
                                            </td>
                                            <td x-text="charge.dueDate"></td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-primary" @click="viewCharge(charge)">
                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button class="btn btn-outline-success" @click="editCharge(charge)">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger" @click="deleteCharge(charge)">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="row" x-show="isFeatureEnabled('FEATURE_REVERSE_CHARGE')">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <span class="me-2">Showing <span x-text="startIndex + 1"></span> to <span x-text="endIndex"></span> of <span x-text="filteredCharges.length"></span> entries</span>
                </div>
            </div>
            <div class="col-md-6">
                <nav>
                    <ul class="pagination justify-content-end mb-0">
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage = 1" :disabled="currentPage === 1">First</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === 1 }">
                            <button class="page-link" @click="currentPage--" :disabled="currentPage === 1">Previous</button>
                        </li>
                        <template x-for="page in visiblePages" :key="page">
                            <li class="page-item" :class="{ 'active': page === currentPage }">
                                <button class="page-link" @click="currentPage = page" x-text="page"></button>
                            </li>
                        </template>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage++" :disabled="currentPage === totalPages">Next</button>
                        </li>
                        <li class="page-item" :class="{ 'disabled': currentPage === totalPages }">
                            <button class="page-link" @click="currentPage = totalPages" :disabled="currentPage === totalPages">Last</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function reverseChargeList() {
            return {
                viewMode: 'grid',
                selectedCharges: [],
                currentPage: 1,
                itemsPerPage: 10,
                sortField: 'supplier',
                sortDirection: 'asc',
                filters: {
                    search: '',
                    serviceType: '',
                    status: '',
                    taxRate: '',
                    startDate: '',
                    endDate: ''
                },
                charges: [
                    { id: 1, supplier: 'ABC Transport Ltd.', serviceType: 'Transport', taxRate: 5, amount: 50000, taxAmount: 2500, status: 'Pending', typeColor: '#dc3545', dueDate: '2024-01-20', description: 'Goods transport services for January 2024' },
                    { id: 2, supplier: 'Legal Associates', serviceType: 'Legal', taxRate: 18, amount: 75000, taxAmount: 13500, status: 'Paid', typeColor: '#0d6efd', dueDate: '2024-01-18', description: 'Legal consultation services for contract review' },
                    { id: 3, supplier: 'Event Sponsors', serviceType: 'Sponsorship', taxRate: 18, amount: 100000, taxAmount: 18000, status: 'Pending', typeColor: '#6f42c1', dueDate: '2024-01-25', description: 'Corporate event sponsorship services' },
                    { id: 4, supplier: 'Director Services Inc.', serviceType: 'Director', taxRate: 18, amount: 120000, taxAmount: 21600, status: 'Overdue', typeColor: '#fd7e14', dueDate: '2024-01-15', description: 'Director services and consultation fees' },
                    { id: 5, supplier: 'Insurance Brokers', serviceType: 'Insurance', taxRate: 18, amount: 25000, taxAmount: 4500, status: 'Processing', typeColor: '#17a2b8', dueDate: '2024-01-30', description: 'Insurance brokerage services for assets' },
                    { id: 6, supplier: 'Quick Logistics', serviceType: 'Transport', taxRate: 5, amount: 35000, taxAmount: 1750, status: 'Paid', typeColor: '#dc3545', dueDate: '2024-01-10', description: 'Local transportation services for December 2023' },
                    { id: 7, supplier: 'Tech Consultants', serviceType: 'Legal', taxRate: 18, amount: 60000, taxAmount: 10800, status: 'Pending', typeColor: '#0d6efd', dueDate: '2024-01-28', description: 'IT legal compliance consultation' },
                    { id: 8, supplier: 'Sports Federation', serviceType: 'Sponsorship', taxRate: 18, amount: 80000, taxAmount: 14400, status: 'Paid', typeColor: '#6f42c1', dueDate: '2024-01-05', description: 'Sports event sponsorship for Q1 2024' }
                ],
                
                get totalCharges() {
                    return this.charges.length;
                },
                
                get paidCharges() {
                    return this.charges.filter(c => c.status === 'Paid').length;
                },
                
                get pendingCharges() {
                    return this.charges.filter(c => c.status === 'Pending').length;
                },
                
                get totalTaxAmount() {
                    return this.charges.reduce((total, charge) => total + charge.taxAmount, 0).toLocaleString('en-IN');
                },
                
                get filteredCharges() {
                    return this.charges.filter(charge => {
                        if (this.filters.search && !charge.supplier.toLowerCase().includes(this.filters.search.toLowerCase())) {
                            return false;
                        }
                        if (this.filters.serviceType && charge.serviceType !== this.filters.serviceType) {
                            return false;
                        }
                        if (this.filters.status && charge.status !== this.filters.status) {
                            return false;
                        }
                        if (this.filters.taxRate && charge.taxRate.toString() !== this.filters.taxRate) {
                            return false;
                        }
                        return true;
                    }).sort((a, b) => {
                        let aVal = a[this.sortField];
                        let bVal = b[this.sortField];
                        
                        if (this.sortDirection === 'asc') {
                            return aVal > bVal ? 1 : -1;
                        } else {
                            return aVal < bVal ? 1 : -1;
                        }
                    });
                },
                
                get paginatedCharges() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    const end = start + this.itemsPerPage;
                    return this.filteredCharges.slice(start, end);
                },
                
                get totalPages() {
                    return Math.ceil(this.filteredCharges.length / this.itemsPerPage);
                },
                
                get startIndex() {
                    return (this.currentPage - 1) * this.itemsPerPage;
                },
                
                get endIndex() {
                    return Math.min(this.startIndex + this.itemsPerPage, this.filteredCharges.length);
                },
                
                get visiblePages() {
                    const pages = [];
                    const maxVisible = 5;
                    const half = Math.floor(maxVisible / 2);
                    
                    let start = Math.max(1, this.currentPage - half);
                    let end = Math.min(this.totalPages, start + maxVisible - 1);
                    
                    if (end - start + 1 < maxVisible) {
                        start = Math.max(1, end - maxVisible + 1);
                    }
                    
                    for (let i = start; i <= end; i++) {
                        pages.push(i);
                    }
                    
                    return pages;
                },
                
                isFeatureEnabled(feature) {
                    return true;
                },
                
                sortBy(field) {
                    if (this.sortField === field) {
                        this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        this.sortField = field;
                        this.sortDirection = 'asc';
                    }
                },
                
                toggleSelectAll() {
                    if (this.selectedCharges.length === this.paginatedCharges.length) {
                        this.selectedCharges = [];
                    } else {
                        this.selectedCharges = this.paginatedCharges.map(charge => charge.id);
                    }
                },
