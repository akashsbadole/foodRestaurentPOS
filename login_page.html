<script>
// Update timestamp in footer
function updateFooterTimestamp() {
    const timestampElement = document.getElementById('footer-timestamp');
    if (timestampElement) {
        const now = new Date();
        const timestamp = now.toLocaleString();
        timestampElement.textContent = timestamp;
    }
}

// Update timestamp every minute
setInterval(updateFooterTimestamp, 60000);
updateFooterTimestamp(); // Initial update

// Dynamic footer content updates
function updateFooterContent(receiptData = null, userData = null) {
    const receiptInfo = document.querySelector('.receipt-info');
    const userInfo = document.querySelector('.user-info');
    
    if (receiptData && receiptInfo) {
        const receiptNumber = receiptInfo.querySelector('.receipt-number');
        const receiptDate = receiptInfo.querySelector('.receipt-date');
        const receiptTime = receiptInfo.querySelector('.receipt-time');
        const receiptTable = receiptInfo.querySelector('.receipt-table');
        
        if (receiptNumber) receiptNumber.textContent = `Receipt #: ${receiptData.order_id}`;
        if (receiptDate) receiptDate.textContent = `Date: ${receiptData.order_date}`;
        if (receiptTime) receiptTime.textContent = `Time: ${receiptData.order_time}`;
        if (receiptTable && receiptData.table_name) receiptTable.textContent = `Table: ${receiptData.table_name}`;
    }
    
    if (userData && userInfo) {
        const userName = userInfo.querySelector('.user-name');
        const userId = userInfo.querySelector('.user-id');
        
        if (userName) userName.textContent = `Served by: ${userData.name}`;
        if (userId) userId.textContent = `ID: ${userData.id}`;
    }
}

// Export functions for global access
window.updateFooterContent = updateFooterContent;
window.updateFooterTimestamp = updateFooterTimestamp;
</script>

<script>
    // Focus on username field when page loads
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('username').focus();
    });
    
    // Handle form submission with Enter key
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
            e.preventDefault();
            document.querySelector('form').dispatchEvent(new Event('submit'));
        }
    });
</script>


    <script>
      // Alpine.js POS Application Data
      function posApp() {
        return {
          isLoading: false,
          activeOrders: {},
          currentOrderId: null,
          currentOrder: {},

          init() {
            // Load orders from session storage
            const savedOrders = sessionStorage.getItem("activeOrders");
            if (savedOrders) {
              this.activeOrders = JSON.parse(savedOrders);
            }

            const currentOrderId = sessionStorage.getItem("currentOrderId");
            if (currentOrderId) {
              this.currentOrderId = currentOrderId;
              this.loadCurrentOrder();
            }

            // Start session keep-alive
            setInterval(() => {
              fetch("/auth/api/keep_alive");
            }, 300000); // Every 5 minutes
          },

          createNewOrder() {
            const orderId = "ORD" + Date.now();
            this.activeOrders[orderId] = {
              orderNumber: this.generateOrderNumber(),
              orderType: "Dine-in",
              customerName: "",
              customerMobile: "",
              tableId: null,
              items: [],
              subtotal: 0,
              cgst: 0,
              sgst: 0,
              discount: 0,
              total: 0,
              status: "New",
              createdAt: new Date().toISOString(),
            };

            this.currentOrderId = orderId;
            this.saveToSession();
            this.loadCurrentOrder();

            // Redirect to orders page if not already there
            if (!window.location.pathname.includes("/orders")) {
              window.location.href = "/orders/new";
            }
          },

          switchToOrder(orderId) {
            // Save current order before switching
            this.saveCurrentOrder();

            this.currentOrderId = orderId;
            this.loadCurrentOrder();
          },

          closeOrder(orderId) {
            if (
              confirm(
                "Are you sure you want to close this order? Any unsaved changes will be lost."
              )
            ) {
              delete this.activeOrders[orderId];

              if (this.currentOrderId === orderId) {
                // Switch to another order or create new one
                const remainingOrders = Object.keys(this.activeOrders);
                if (remainingOrders.length > 0) {
                  this.currentOrderId = remainingOrders[0];
                  this.loadCurrentOrder();
                } else {
                  this.createNewOrder();
                }
              }

              this.saveToSession();
            }
          },

          saveCurrentOrder() {
            if (this.currentOrderId && this.activeOrders[this.currentOrderId]) {
              this.activeOrders[this.currentOrderId] = { ...this.currentOrder };
              this.saveToSession();
            }
          },

          loadCurrentOrder() {
            if (this.currentOrderId && this.activeOrders[this.currentOrderId]) {
              this.currentOrder = { ...this.activeOrders[this.currentOrderId] };
              this.$nextTick(() => {
                // Trigger any Alpine.js reactivity updates
                this.updateCalculations();
              });
            }
          },

          saveToSession() {
            sessionStorage.setItem(
              "activeOrders",
              JSON.stringify(this.activeOrders)
            );
            sessionStorage.setItem("currentOrderId", this.currentOrderId);
          },

          generateOrderNumber() {
            const now = new Date();
            const dateStr =
              now.getFullYear() +
              String(now.getMonth() + 1).padStart(2, "0") +
              String(now.getDate()).padStart(2, "0");
            const randomStr = Math.random()
              .toString(36)
              .substr(2, 8)
              .toUpperCase();
            return "ORD" + dateStr + randomStr;
          },

          updateCalculations() {
            // This will be overridden by specific pages
          },
        };
      }
      
      // Footer Component
      function footerComponent() {
        return {
          footerSettings: {
            enabled: false,
            custom_text: '',
            show_user_name: false,
            show_business_info: false,
            multiline: false,
            line1: '',
            line2: '',
            line3: ''
          },
          
          initFooter() {
            // Load footer settings from API or use defaults
            this.loadFooterSettings();
            
            // Update time every second
            setInterval(() => {
              this.updateTime();
            }, 1000);
          },
          
          async loadFooterSettings() {
            try {
              const response = await fetch('/api/settings/footer');
              if (response.ok) {
                const data = await response.json();
                this.footerSettings = {
                  enabled: data.footer_enabled === 'true',
                  custom_text: data.footer_custom_text || 'Thank you for your business!',
                  show_user_name: data.footer_show_user_name === 'true',
                  show_business_info: data.footer_show_business_info === 'true',
                  multiline: data.footer_multiline === 'true',
                  line1: data.footer_line1 || '',
                  line2: data.footer_line2 || '',
                  line3: data.footer_line3 || ''
                };
              }
            } catch (error) {
              console.error('Error loading footer settings:', error);
              // Use defaults if API fails
              this.footerSettings = {
                enabled: true,
                custom_text: 'Thank you for your business!',
                show_user_name: true,
                show_business_info: true,
                multiline: false,
                line1: '',
                line2: '',
                line3: ''
              };
            }
          },
          
          getCurrentTime() {
            return new Date().toLocaleString();
          },
          
          updateTime() {
            // This will be called by setInterval to update time displays
          }
        };
      }
    </script>
